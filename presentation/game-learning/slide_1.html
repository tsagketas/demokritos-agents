<!DOCTYPE html>

<html lang="el">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cover Slide</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&amp;family=Roboto:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; font-family: 'Roboto', sans-serif; }
        .slide-container {
            width: 1280px;
            height: 720px;
            position: relative;
            display: flex;
            flex-direction: column;
            background-color: #0f172a; /* Slate 900 */
            color: #ffffff;
            overflow: hidden;
        }
        .font-heading { font-family: 'Montserrat', sans-serif; }
        
        /* Decorative Background Shapes */
        .shape-1 {
            position: absolute;
            top: -150px;
            right: -100px;
            width: 600px;
            height: 600px;
            background-color: #1e3a8a; /* Blue 900 */
            border-radius: 40px;
            transform: rotate(15deg);
            opacity: 0.4;
            z-index: 0;
        }
        .shape-2 {
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            background-color: #1d4ed8; /* Blue 700 */
            border-radius: 50%;
            opacity: 0.2;
            z-index: 0;
        }
        .shape-3 {
            position: absolute;
            top: 20%;
            right: 15%;
            width: 20px;
            height: 20px;
            background-color: #3b82f6; /* Blue 500 */
            border-radius: 50%;
            z-index: 0;
        }
        .shape-4 {
            position: absolute;
            bottom: 30%;
            left: 40%;
            width: 15px;
            height: 15px;
            background-color: #60a5fa; /* Blue 400 */
            border-radius: 50%;
            z-index: 0;
        }
    </style>
</head>
<body>
<div class="slide-container">
<!-- Background Elements -->
<div class="shape-1"></div>
<div class="shape-2"></div>
<div class="shape-3"></div>
<div class="shape-4"></div>
<!-- Main Content -->
<div class="flex-1 flex flex-col justify-center px-24 z-10">
<!-- Icon Top Left -->
<div class="mb-10 animate-fade-in-down">
<div class="inline-flex items-center justify-center w-20 h-20 bg-blue-600 rounded-2xl shadow-lg text-white">
<i class="fa-solid fa-chess-board text-4xl"></i>
</div>
</div>
<!-- Title Section -->
<div class="border-l-8 border-blue-500 pl-10 mb-8">
<h1 class="font-heading text-6xl font-extrabold leading-tight mb-4 tracking-tight">
                    Fictitious Play 
                    <span class="text-blue-400">&amp;</span> <br/>
                    Reinforcement Learning
                </h1>
<p class="text-3xl font-light text-blue-100 max-w-4xl leading-snug">
                    Για υπολογισμό ισορροπιών σε μηδενικού αθροίσματος και στοχαστικά παίγνια
                </p>
</div>
<!-- Details / Date -->
<div class="flex items-center mt-12 pl-12">
<div class="flex items-center text-blue-300">
<i class="fa-regular fa-calendar-days mr-3 text-xl"></i>
<p class="text-xl tracking-widest font-medium uppercase">Φεβρουάριος 2026</p>
</div>
</div>
</div>
<!-- Bottom Bar -->
<div class="absolute bottom-0 w-full h-3 bg-gradient-to-r from-blue-800 to-blue-500"></div>
<div class="absolute bottom-0 left-0 w-1/3 h-3 bg-blue-400 z-20"></div>
</div>
</body>
</html>
