&lt;h1&gt;Θεωρητικό πλαίσιο&lt;/h1&gt;
&lt;h2&gt;Zero-sum παίγνια&lt;/h2&gt;
&lt;p&gt;U₁ + U₂ = 0. Πίνακας αποδόσεων M: M[i,j] payoff του Row όταν παίζουν (i,j). Μικτές στρατηγικές x∈Δₘ, y∈Δₙ. u(x,y)=xᵀMy.&lt;/p&gt;
&lt;h2&gt;Ισορροπία Nash&lt;/h2&gt;
&lt;p&gt;(x*,y*) όπου x*∈argmax xᵀMy*, y*∈argmin (x*)ᵀMy. Σε MP δεν υπάρχει pure NE, μοναδικό mixed NE: (0.5,0.5). Σε RPS: (1/3,1/3,1/3).&lt;/p&gt;
&lt;h2&gt;Θεώρημα Minimax&lt;/h2&gt;
&lt;div class=&quot;formula&quot;&gt;maxₓ minᵧ xᵀMy = minᵧ maxₓ xᵀMy&lt;/div&gt;
&lt;p&gt;Η minimax στρατηγική ταυτίζεται με το Nash. Εφαρμόζεται σε sequential games με τέλεια πληροφορία.&lt;/p&gt;
&lt;/div&gt;

&lt;h2&gt;FP&lt;/h2&gt;
&lt;p&gt;Συγκλίνει στο Nash σε self-play (MP, RPS). Ευάλωτη σε RL: δεν είναι no-regret, regret γραμμικό. «Κοντά στο Nash» ≠ «κερδίζω» όταν ο αντίπαλος αλλάζει.&lt;/p&gt;
&lt;h2&gt;Q-Learning&lt;/h2&gt;
&lt;p&gt;Εκμεταλλεύεται FP (MP: +374, RPS: +213). Σε RL vs RL matrix: δεν συγκλίνει σε Nash, non-stationary. Στο Grid: RL Hunter 85–89% capture vs 6.5% MinMax vs RL.&lt;/p&gt;
&lt;h2&gt;Επιλογή μεθόδου&lt;/h2&gt;
&lt;p&gt;Equilibrium computation (FP) | Robust/minimax | Πρακτική βελτιστοποίηση (RL). FP και Q-learning δεν είναι ανταγωνιστές — διαφορετικός στόχος. Nash = ασφάλεια απέναντι σε βέλτιστο αντίπαλο, όχι εγγύηση reward vs μαθησιακό.&lt;/p&gt;
